<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Realidade Aumentada</title>
    
    <!-- Importa o script oficial do Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        /* Estilo do botão de Realidade Aumentada na tela */
        #ar-button {
            background: #ffffff;
            color: #222;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Componente Model Viewer do Google -->
    <model-viewer 
        src="dog.glb" 
        ios-src="" 
        alt="Modelo 3D em Realidade Aumentada" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate>
        
        <button id="ar-button" slot="ar-button">
            📦 Ver no seu Espaço (AR)
        </button>
    </model-viewer>

</body>
</html>
