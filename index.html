<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cachorro em Realidade Aumentada</title>
    
    <!-- Importa o script oficial do Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        /* CSS para garantir que o fundo da página seja transparente */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent; /* FUNDO TRANSPARENTE */
            overflow: hidden;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent; /* FUNDO TRANSPARENTE NO CARREGAMENTO */
            background-color: transparent; /* FUNDO TRANSPARENTE NO MODELO */
        }
        
        /* Botão estilizado para abrir a AR */
        #ar-button {
            background-color: #007bff;
            color: white;
            border-radius: 8px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Componente Model Viewer do Google -->
    <!-- Mude "cachorro.glb" abaixo para o nome exato do seu arquivo 3D -->
    <model-viewer 
        src="cachorro.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1" 
        alt="Um cachorro em Realidade Aumentada">
        
        <button id="ar-button" slot="ar-button">
            🐶 Ver Cachorro no meu Espaço
        </button>
    </model-viewer>

</body>
</html>
