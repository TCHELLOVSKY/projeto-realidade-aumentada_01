<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidade Aumentada sobre o QR Code</title>
    
    <!-- Importa biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Importa biblioteca MindAR para rastreamento de imagem -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!--
      scene-target: aponta para o arquivo .mind gerado
    -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Carrega o seu arquivo 3D do cachorro -->
            <a-asset-item id="dogModel" src="dog.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 
          targetIndex: 0 (Refere-se ao primeiro alvo do arquivo .mind)
        -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- 
              position="0 0 0": Posição do modelo em cima do QR Code
              scale="0.5 0.5 0.5": Ajusta o tamanho do cachorro (aumente ou diminua se preciso)
              rotation="90 0 0": Rotaciona para ficar em pé em cima da folha impressa
            -->
            <a-gltf-model 
                src="#dogModel" 
                position="0 0 0" 
                rotation="90 0 0" 
                scale="0.5 0.5 0.5">
            </a-gltf-model>
        </a-entity>

    </a-scene>

</body>
</html>
